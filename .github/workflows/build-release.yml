name: Generate Keystore & Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main # Ganti master jika branch Anda master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan Java 11 (versi 55.0) yang dibutuhkan dependensi proyek
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Update Gradle Wrapper ke 6.9.4 agar kompatibel dengan Java 11
      - name: Setup Gradle Environment
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_FILE")
            echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          else
            echo "GRADLE_DIR=." >> $GITHUB_ENV
          fi

          # Bersihkan opsi JVM bawaan runner yang tidak dikenal
          unset _JAVA_OPTIONS
          unset JAVA_TOOL_OPTIONS

          # Pastikan gradle wrapper menggunakan versi 6.9.4 yang mendukung Java 11
          sed -i -E 's/gradle-[0-9.]+-bin.zip/gradle-6.9.4-bin.zip/g' $(find . -name "gradle-wrapper.properties") || true
          chmod +x $(find . -name "gradlew") || true

      # 1. BUAT KEYSTORE OTOMATIS
      - name: Generate Keystore on Runner
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/my-release-key.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Resep Nusantara, OU=App, O=ResepNusantara, L=Jakarta, ST=Jakarta, C=ID"

      # 2. BUILD DAN SIGN APK RELEASE
      - name: Build Signed Release APK
        working-directory: ${{ env.GRADLE_DIR }}
        env:
          _JAVA_OPTIONS: ""
          JAVA_TOOL_OPTIONS: ""
          KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 3. UPLOAD APK HASIL BUILD
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ResepNusantara-Release-APK
          path: '**/build/outputs/apk/release/*.apk'

      # 4. SIMPAN CADANGAN KEYSTORE KE ARTIFACTS
      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Release-Keystore-Backup
          path: ${{ runner.temp }}/my-release-key.jks
          
