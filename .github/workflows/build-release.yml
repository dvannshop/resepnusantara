name: Generate Keystore & Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main # Sesuaikan jika nama branch master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan Java 8 agar cocok dengan Gradle 4.x
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # Cari letak gradlew secara otomatis
      - name: Locate and Prepare Gradlew
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_FILE")
            echo "Menemukan gradlew di: $GRADLE_DIR"
            chmod +x "$GRADLEW_FILE"
            echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          else
            echo "File gradlew tidak ditemukan! Menginstal gradle wrapper baru..."
            sudo apt-get install -y gradle
            gradle wrapper
            chmod +x gradlew
            echo "GRADLE_DIR=." >> $GITHUB_ENV
          fi

      # 1. BUAT KEYSTORE OTOMATIS
      - name: Generate Keystore on Runner
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/my-release-key.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Resep Nusantara, OU=App, O=ResepNusantara, L=Jakarta, ST=Jakarta, C=ID"

      # 2. BUILD DAN SIGN APK RELEASE
      - name: Build Signed Release APK
        working-directory: ${{ env.GRADLE_DIR }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 3. UPLOAD APK HASIL BUILD
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ResepNusantara-Release-APK
          path: '**/build/outputs/apk/release/*.apk'

      # 4. SIMPAN CADANGAN KEYSTORE KE ARTIFACTS
      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Release-Keystore-Backup
          path: ${{ runner.temp }}/my-release-key.jks
          
