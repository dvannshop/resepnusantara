name: Generate Keystore & Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # Cari direktori root project
      - name: Locate Project Directory
        run: |
          BUILD_FILE=$(find . -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # Buat fallback google-services.json jika belum ada di repositori
      - name: Ensure google-services.json Exists
        run: |
          APP_DIR=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then APP_DIR="app"; fi
          
          if [ ! -f "$APP_DIR/google-services.json" ]; then
            echo "Membuat template google-services.json..."
            cat << 'EOF' > "$APP_DIR/google-services.json"
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "resep-nusantara",
              "storage_bucket": "resep-nusantara.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.example.resepnusantara"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "fake_api_key_for_ci_build" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # 1. BUAT KEYSTORE RELEASE OTOMATIS
      - name: Generate Keystore on Runner
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/my-release-key.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Resep Nusantara, OU=App, O=ResepNusantara, L=Jakarta, ST=Jakarta, C=ID"

      # 2. BUILD DAN SIGN APK RELEASE
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon -Djava.awt.headless=true

      # 3. UPLOAD APK HASIL BUILD KE ARTIFACTS
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ResepNusantara-Release-APK
          path: '**/build/outputs/apk/release/*.apk'

      # 4. SIMPAN CADANGAN KEYSTORE KE ARTIFACTS
      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Release-Keystore-Backup
          path: ${{ runner.temp }}/my-release-key.jks
          
