name: Generate Keystore & Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Pasang Gradle versi 7.6.4 (Kompatibel penuh dengan Java 11)
      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      # Cari letak file build.gradle proyek Anda
      - name: Locate Project Directory
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app/" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            PROJECT_DIR="."
          fi
          echo "Menemukan project di folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # 1. BUAT KEYSTORE OTOMATIS
      - name: Generate Keystore on Runner
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/my-release-key.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Resep Nusantara, OU=App, O=ResepNusantara, L=Jakarta, ST=Jakarta, C=ID"

      # 2. BUILD DAN SIGN APK RELEASE
      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # 3. UPLOAD APK HASIL BUILD KE ARTIFACTS
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ResepNusantara-Release-APK
          path: '**/build/outputs/apk/release/*.apk'

      # 4. SIMPAN CADANGAN KEYSTORE KE ARTIFACTS
      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Release-Keystore-Backup
          path: ${{ runner.temp }}/my-release-key.jks
          
