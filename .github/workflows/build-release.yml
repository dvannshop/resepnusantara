name: Generate Keystore & Build Release APK

on:
  workflow_dispatch: # Memungkinkan klik tombol 'Run workflow' secara manual
  push:
    branches:
      - main # Atau sesuaikan dengan nama branch utama Anda (misal: master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 1. BUAT KEYSTORE OTOMATIS DI SERVER GITHUB
      - name: Generate Keystore on Runner
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/my-release-key.jks \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Resep Nusantara, OU=App, O=ResepNusantara, L=Jakarta, ST=Jakarta, C=ID"

      # 2. BUILD DAN SIGN APK RELEASE
      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: my-key-alias
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 3. UPLOAD APK HASIL BUILD KE GITHUB ARTIFACTS
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ResepNusantara-Release-APK
          path: app/build/outputs/apk/release/*.apk

      # 4. SIMPAN CADANGAN KEYSTORE KE ARTIFACTS (PENTING!)
      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Release-Keystore-Backup
          path: ${{ runner.temp }}/my-release-key.jks
          
